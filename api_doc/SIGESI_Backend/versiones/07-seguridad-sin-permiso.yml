info:
  name: Seguridad · Sin permiso de matriz (403)
  type: http
  seq: 7

http:
  method: GET
  url: "{{apiUrl}}/articles/{{articleId}}/corrected-version/"
  headers:
    - name: Authorization
      value: "Bearer {{tokenSinPermiso}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Prueba de seguridad: token válido de un usuario cuyo rol NO tiene article:view en profile_action.
  Variable de entorno: tokenSinPermiso. Esperado: 403 y ningún dato del artículo.
