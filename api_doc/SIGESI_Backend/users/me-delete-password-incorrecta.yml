info:
  name: SCRUM-129 · Contraseña incorrecta (400)
  type: http
  seq: 2

http:
  method: POST
  url: "{{apiUrl}}/users/me/delete/"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "password": "contraseña-incorrecta"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Esperado: 400 {"password": ["La contraseña es incorrecta."]} y la cuenta NO cambia.
  Con 5 intentos seguidos en un minuto, el sexto devuelve 429.
